# Shared by every application connected to the config server.
# A file named after a service (e.g. service-polices.properties) overrides these values.

management.endpoints.web.exposure.include=health,info

# Every client registers with the Eureka discovery server under its spring.application.name.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
