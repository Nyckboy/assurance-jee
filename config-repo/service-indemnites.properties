# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Resilience of the Feign calls to service-sinistres and service-polices
# Order, outermost first: Retry (@Retryable) -> Circuit Breaker + TimeLimiter (Resilience4j) -> Feign timeouts.
spring.cloud.openfeign.circuitbreaker.enabled=true

# Timeouts: Feign connection and read timeouts, plus an overall limit per attempt.
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
resilience4j.timelimiter.configs.default.timeout-duration=5s

# Circuit breaker: opens when at least half of the last 10 calls failed (minimum 5 calls),
# rejects calls for 10 s, then lets 2 test calls through. 4xx answers are business answers, not failures.
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException$FeignClientException

# Retry: up to 2 retries after the first attempt, 500 ms then 1 s apart, only when the service is unavailable.
resilience.retry.max-retries=2
resilience.retry.delay=500ms
resilience.retry.multiplier=2
