# Routes resolve instances from Eureka by service name (lb://<spring.application.name>) and load-balance across them.
spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: policies-service
              uri: lb://service-polices
              predicates:
                - Path=/api/policies/**
            - id: claims-service
              uri: lb://service-sinistres
              predicates:
                - Path=/api/claims/**
            - id: indemnities-service
              uri: lb://service-indemnites
              predicates:
                - Path=/api/indemnities/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
