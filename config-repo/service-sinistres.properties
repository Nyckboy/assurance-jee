spring.datasource.url=jdbc:h2:mem:claimsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka: publishes claim-declared and expertise-completed, consumes indemnity-paid (see service-sinistres/README.md)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
# When the broker is down, a send waits at most 5 s (Kafka's default is 60 s), so declaring a claim
# or recording an expertise does not hang the HTTP request for a minute.
spring.kafka.producer.properties.max.block.ms=5000
