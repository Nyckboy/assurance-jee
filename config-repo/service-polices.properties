spring.datasource.url=jdbc:h2:mem:policiesdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka: consumes claim-declared and indemnity-paid (see service-polices/README.md)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest

# Premium rule applied on indemnity-paid: each paid claim raises the policy premium by this rate (0.10 = +10%).
policies.premium.increase-rate-per-paid-claim=0.10

# Email notifications to policyholders (claim recorded, indemnity paid).
# Local default: Mailpit (SMTP on 1025, inbox at http://localhost:8025). Without a mail server, the failure is logged.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
policies.notifications.from=Sinistre-Pro <no-reply@sinistre-pro.local>
