spring.datasource.url=jdbc:h2:mem:policiesdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka: consumes claim-declared and indemnity-paid (see service-polices/README.md)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest

# Premium rule applied on indemnity-paid: each paid claim raises the policy premium by this rate (0.10 = +10%).
policies.premium.increase-rate-per-paid-claim=0.10
