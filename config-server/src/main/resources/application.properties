spring.application.name=config-server
server.port=8888

# The native profile serves files from a folder instead of a Git repository.
# The default path assumes the server is started from the config-server directory.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_LOCATION:file:../config-repo/}

management.endpoints.web.exposure.include=health,info
